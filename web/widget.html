<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blender scene</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif;color:light-dark(#262522,#ecebe7);background:light-dark(#f6f5f1,#1a1b1b)}
    *{box-sizing:border-box}body{margin:0}button,input,a{font:inherit}button,a.download{border:1px solid light-dark(#d9d7d0,#414343);border-radius:8px;background:transparent;color:inherit;padding:7px 11px;cursor:pointer;text-decoration:none;font-size:12px}button:hover,a.download:hover{background:light-dark(#e6e4dd,#303333)}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true]{background:light-dark(#deddd6,#3d4140)}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #73ac97;outline-offset:2px}
    header,footer{padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{border-bottom:1px solid light-dark(#deddd6,#303333)}h1{font-size:14px;font-weight:600;margin:0;margin-right:auto}#status{font-size:12px;color:light-dark(#66665f,#adaea7)}#stage{position:relative;height:360px;background:light-dark(#eeede7,#202222);overflow:hidden}#canvas{position:absolute;inset:0;display:none;align-items:center;justify-content:center}canvas{display:block;max-width:100%}#render{width:100%;height:100%;object-fit:contain;display:none}#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;font-size:14px;color:light-dark(#696a61,#adaea7)}#reference{position:absolute;right:12px;bottom:12px;width:76px;height:76px;object-fit:contain;border:1px solid light-dark(#d4d2c9,#535852);border-radius:8px;background:light-dark(#f5f4f0,#222);display:none}#note{font-size:11px;margin-right:auto;color:light-dark(#707168,#a2a69c);max-width:65ch}#refine{padding:0 16px 14px;display:flex;gap:8px}input[type=text]{flex:1;min-width:0;background:transparent;border:1px solid light-dark(#d9d7d0,#414343);border-radius:8px;color:inherit;padding:9px 11px;font-size:13px}#message{font-size:12px;min-height:16px;padding:0 16px 10px;color:light-dark(#80624c,#d8b995)}#upload{display:none}#file{display:none}@media(max-width:460px){#stage{height:300px}header,footer{padding:10px}#note{flex-basis:100%}#refine{padding:0 10px 10px}}
  </style>
</head>
<body>
  <header>
    <h1>Blender scene</h1><span id="status" role="status">Connecting</span>
    <button id="mode-render" aria-pressed="true">Render</button>
    <button id="mode-3d" aria-pressed="false" disabled>3D</button>
    <button id="reset" aria-label="Reset camera" title="Reset camera" disabled>↺</button>
    <button id="fullscreen" aria-label="Expand viewer" title="Expand viewer">⛶</button>
  </header>
  <div id="stage">
    <div id="canvas"></div>
    <img id="render" crossorigin="anonymous" alt="Rendered Blender scene">
    <div id="empty">Create a scene in the conversation to preview it here</div>
    <img id="reference" alt="Target reference image">
  </div>
  <footer>
    <span id="note">Drag to orbit · Scroll to zoom · Right-drag to pan</span>
    <a id="download-glb" class="download" hidden>Download GLB</a>
    <a id="download-blend" class="download" hidden>Download Blender file</a>
    <button id="upload">Use image</button>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
  </footer>
  <div id="refine">
    <input id="prompt" type="text" aria-label="Scene refinement" placeholder="For example: soften the light and move the camera closer">
    <button type="button" id="send" disabled>Refine</button>
  </div>
  <div id="message" role="status"></div>
  <!--WIDGET_SCRIPT-->
</body>
</html>
